name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install site dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # No secrets are needed: tests/setup.js points the Admin SDK at the
      # emulator and substitutes dummy Stripe/Gmail credentials, so nothing can
      # reach the live project even if a mock were to fail.
      - name: Test (payments + firestore rules)
        run: npm test

      - name: Build
        run: npm run build
